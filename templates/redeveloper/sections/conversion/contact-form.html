<section class="section-padding">
  <div class="container">
    <div class="section-title-wrap">
      <h2>Submit a Property for Review</h2>
      <p>We acquire and redevelop residential properties throughout Central Indiana. There is no obligation to accept an offer.</p>
    </div>
    <div class="form-container">
      <form id="property-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you! Your property details have been submitted. Our acquisitions team will contact you shortly.');">
        <fieldset style="border: none; margin-bottom: var(--space-6);">
          <legend style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); margin-bottom: var(--space-4); color: var(--color-text-primary);">Property Details</legend>
          <div class="form-group">
            <label for="address" class="form-label">Property Address *</label>
            <input type="text" id="address" name="address" class="form-input" placeholder="123 Main St" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="city" class="form-label">City *</label>
              <input type="text" id="city" name="city" class="form-input" placeholder="Indianapolis" required>
            </div>
            <div class="form-group">
              <label for="zip" class="form-label">ZIP *</label>
              <input type="text" id="zip" name="zip" class="form-input" placeholder="46201" required>
            </div>
          </div>
          <div class="form-group">
            <label for="condition" class="form-label">General Condition *</label>
            <select id="condition" name="condition" class="form-select" required>
              <option value="" disabled selected>Select...</option>
              <option value="needs_minor_updates">Needs minor updates</option>
              <option value="needs_major_repairs">Needs major repairs</option>
              <option value="complete_rehab">Complete gut/rehab needed</option>
            </select>
          </div>
        </fieldset>
        
        <fieldset style="border: none; margin-bottom: var(--space-6);">
          <legend style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); margin-bottom: var(--space-4); color: var(--color-text-primary);">Contact Information</legend>
          <div class="form-group">
            <label for="contact_name" class="form-label">Full Name *</label>
            <input type="text" id="contact_name" name="contact_name" class="form-input" placeholder="Jane Doe" required>
          </div>
          <div class="form-group">
            <label for="phone" class="form-label">Phone Number *</label>
            <input type="tel" id="phone" name="phone" class="form-input" placeholder="(317) 555-0199" required>
          </div>
        </fieldset>

        <div class="checkbox-wrapper">
          <input type="checkbox" id="consent" class="checkbox" required>
          <label for="consent" class="form-label" style="font-weight: var(--font-weight-regular);">I consent to be contacted regarding this property submission. *</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">Submit Property</button>
      </form>
    </div>
  </div>
</section>
