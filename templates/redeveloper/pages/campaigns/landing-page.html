<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Acquisition Campaign | Redeveloper</title>
  <link rel="stylesheet" href="../../css/global.css">
</head>
<body>

  

  <!-- Page Hero -->
  <section class="hero" style="padding: var(--space-12) 0; background: linear-gradient(135deg, var(--color-primary-700) 0%, var(--color-primary-500) 100%);">
    <div class="container">
      <ul class="breadcrumbs">
        <li><a href="../../index.html" style="color: rgba(255, 255, 255, 0.7);">Home</a></li>
        <li><a href="#" style="color: rgba(255, 255, 255, 0.7);">Campaigns</a></li>
        <li style="color: white;" aria-current="page">Special Acquisition Campaign</li>
      </ul>
      <h1 style="color: var(--color-text-inverse); margin-bottom: var(--space-2);">Get a Cash Offer Today</h1>
      <p style="color: rgba(255, 255, 255, 0.85); margin-bottom: 0;">Enter your property details below for an accelerated 48-hour cash offer review.</p>
    </div>
  </section>

  <section class="section-padding"><div class="container"><h2>Campaign Form</h2><p>Accelerated evaluation page.</p></div></section>

  

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Set copyright year automatically
      const yearEl = document.getElementById('footer-year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Load client data dynamically
      loadClientData();
    });

    async function loadClientData() {
      try {
        const response = await fetch('../../data/client.json');
        if (!response.ok) return;
        const data = await response.json();
        
        // Bind simple key-value tokens
        document.querySelectorAll('[data-token]').forEach(el => {
          const tokenName = el.getAttribute('data-token');
          const keys = tokenName.split('.');
          let val = data;
          for (const key of keys) {
            if (val) val = val[key];
          }
          if (val) {
            if (el.tagName === 'A' && tokenName === 'business.phone') {
              el.href = 'tel:' + val.replace(/\D/g, '');
            } else if (el.tagName === 'A' && tokenName === 'business.email') {
              el.href = 'mailto:' + val;
            }
            el.textContent = val;
          }
        });
      } catch (e) {
        console.warn("Could not dynamically load client.json.", e);
      }
    }
  </script>
</body>
</html>
